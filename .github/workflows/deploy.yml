name: Run tests

on:
  push:
    branches:
      - main
      - dev
    # Un tag vX.Y.Z fa girare i test e pubblica l'immagine di release (job build-and-push).
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customerhive_testing
          MYSQL_USER: chive_user
          MYSQL_PASSWORD: chive_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath bz2 curl exif ftp gd gettext mbstring mysqli mysqlnd openssl pdo_mysql pdo_sqlite readline zip zlib
          coverage: none

      - name: Run composer install
        run: composer install -n --prefer-dist

      - name: Prepare Laravel Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
        run: php artisan test

  deploy-dev:
    name: Deploy to dev.thecustomerhive.com
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEV_DEPLOY_PATH }}
            git fetch origin dev
            git reset --hard origin/dev
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan queue:restart

      - name: Verifica post-deploy (smoke test)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null "http://${{ secrets.DEV_SSH_HOST }}/admin"; then
              echo "Sito raggiungibile dopo il deploy."
              exit 0
            fi
            echo "Tentativo $i fallito, riprovo tra 5s..."
            sleep 5
          done
          echo "Il sito non risponde dopo il deploy."
          exit 1

  # Immagine di produzione su Docker Hub (repository PRIVATO donicid4p/customerhive, da creare prima su Docker Hub:
  # un repository creato dal primo push puo' nascere pubblico). Vedi docs/refactoring/302.
  #   push su dev      -> dev-latest e dev-<sha>
  #   tag vX.Y.Z       -> vX.Y.Z (nessuna immagine di versione senza un tag esplicito)
  # Solo se i test passano. Le Pull Request non pubblicano nulla.
  build-and-push:
    name: Build and push image (Docker Hub)
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Versione mostrata nel footer (APP_VERSION): il tag per le release, dev-<sha7> per dev.
      - name: Calcola la versione
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag dell'immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: donicid4p/customerhive
          tags: |
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Qui, quando esistera' l'endpoint di Chive CP, si avvisa il Gateway del nuovo tag (vedi docs/refactoring/302):
      #   curl -X POST https://<gateway>/ci/webhook -H "Authorization: Bearer $CI_WEBHOOK_TOKEN" -d '{"tag":"...","branch":"dev"}'
