name: Run tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customerhive_testing
          MYSQL_USER: chive_user
          MYSQL_PASSWORD: chive_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath bz2 curl exif ftp gd gettext mbstring mysqli mysqlnd openssl pdo_mysql pdo_sqlite readline zip zlib
          coverage: none

      - name: Run composer install
        run: composer install -n --prefer-dist

      - name: Prepare Laravel Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
        run: php artisan test

  deploy-dev:
    name: Deploy to dev.thecustomerhive.com
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEV_DEPLOY_PATH }}
            git fetch origin dev
            git reset --hard origin/dev
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear

      - name: Verifica post-deploy (smoke test)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null "http://${{ secrets.DEV_SSH_HOST }}/admin"; then
              echo "Sito raggiungibile dopo il deploy."
              exit 0
            fi
            echo "Tentativo $i fallito, riprovo tra 5s..."
            sleep 5
          done
          echo "Il sito non risponde dopo il deploy."
          exit 1
