networks:
  laravel:
    driver: bridge

volumes:
  customerhive-mysql:
    driver: local
  customerhive-vendor:
    driver: local
  customerhive-storage-framework:
    driver: local
  customerhive-bootstrap-cache:
    driver: local

services:
  # Applicazione Laravel (PHP + Apache)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: customerhive_app
    volumes:
      - .:/var/www/html
      # vendor/ e le cache generate restano su volumi Docker nativi invece che
      # sul bind mount: su Docker Desktop (Windows/Mac) l'I/O su migliaia di
      # piccoli file attraverso il bind mount e' molto piu' lento che su un
      # volume nativo, e questo da solo rende l'app percepibilmente lenta.
      - customerhive-vendor:/var/www/html/vendor
      - customerhive-storage-framework:/var/www/html/storage/framework
      - customerhive-bootstrap-cache:/var/www/html/bootstrap/cache
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-customerhive}
      DB_USERNAME: ${DB_USERNAME:-chive_user}
      DB_PASSWORD: ${DB_PASSWORD:-chive_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  # Database MySQL
  db:
    image: mysql:8.0
    container_name: customerhive_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-customerhive}
      MYSQL_USER: ${DB_USERNAME:-chive_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chive_password}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - customerhive-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel

  # Compilazione asset front-end (gulp). Facoltativo: `docker compose --profile assets up node`
  node:
    image: node:14-alpine
    container_name: customerhive_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev"
    profiles:
      - assets
    networks:
      - laravel
