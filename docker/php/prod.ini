; php.ini di PRODUZIONE (immagine docker/Dockerfile.prod).
; Lo sviluppo locale usa docker/php/local.ini: non toccarlo da qui.

; --- Errori: mai a video, sempre su stderr (con mod_php finiscono
; nell'ErrorLog di Apache, che l'immagine php inoltra a stderr -> docker logs).
expose_php=Off
display_errors=Off
display_startup_errors=Off
html_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Limiti: stessi di local.ini (upload e tempo di esecuzione).
upload_max_filesize=64M
post_max_size=64M
memory_limit=512M
max_execution_time=300

; --- OPcache attivo, MA con controllo dei timestamp: il module builder
; scrive/modifica controller PHP a runtime (storage/app/custom-controllers)
; e devono essere visti entro pochi secondi. NON mettere validate_timestamps=0.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
