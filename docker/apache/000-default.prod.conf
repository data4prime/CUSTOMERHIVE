# Virtual host di PRODUZIONE (immagine docker/Dockerfile.prod).
# Ascolta su 8080 (il processo gira come www-data, non puo' usare la 80).
<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # /health viene interrogato dall'orchestratore ogni pochi secondi: non
    # va nei log di accesso.
    SetEnvIf Request_URI "^/health/?$" nolog

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!nolog
</VirtualHost>
